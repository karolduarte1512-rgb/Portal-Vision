<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portal Vision">
  <title>Portal Vision</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#061b3a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
    #appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .22s ease}
    body.ready #appFrame{opacity:1}

    #splash{
      position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:linear-gradient(155deg,#061b3a 0%,#0a315e 62%,#1768c5 100%);color:#fff;
      transition:opacity .28s ease,visibility .28s ease
    }
    body.ready #splash{opacity:0;visibility:hidden;pointer-events:none}
    #splash img{width:132px;height:132px;object-fit:contain;border-radius:28px;box-shadow:0 18px 44px rgba(0,0,0,.22)}
    #splash h1{font-size:25px;margin:20px 0 5px;letter-spacing:-.4px}
    #splash p{font-size:12px;opacity:.8;margin:0}
    .loader{width:32px;height:32px;border:3px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;margin-top:24px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    #installBar{
      position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:30;
      display:none;align-items:center;gap:10px;padding:11px 12px;background:#fff;border-radius:15px;
      box-shadow:0 10px 32px rgba(0,0,0,.22);color:#061b3a
    }
    #installBar.show{display:flex}
    #installBar img{width:42px;height:42px;border-radius:10px}
    #installText{flex:1;min-width:0}
    #installText strong{display:block;font-size:12px}
    #installText span{display:block;font-size:9px;color:#667085;margin-top:3px;line-height:1.35}
    #installBtn{border:0;background:#061b3a;color:#fff;border-radius:9px;padding:10px 11px;font-size:9px;font-weight:900}
    #dismissBtn{border:0;background:transparent;color:#667085;font-size:18px;padding:5px}

    #iosHelp{
      position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;background:rgba(0,0,0,.48);padding:16px
    }
    #iosHelp.show{display:flex}
    .sheet{width:100%;background:#fff;border-radius:20px;padding:20px;color:#172033}
    .sheet h2{font-size:18px;margin:0 0 10px}
    .sheet p{font-size:13px;line-height:1.5;color:#667085}
    .sheet button{width:100%;border:0;background:#061b3a;color:#fff;border-radius:11px;padding:13px;font-weight:800}
  </style>
</head>
<body>
  <div id="splash">
    <img src="./icons/icon-192.png" alt="Portal Vision">
    <h1>Portal Vision</h1>
    <p>Seu condomínio em um só lugar</p>
    <div class="loader"></div>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxP42ZGm-M8IGkBxHYqiohbfQXP0xkCZ6rQf4w9MbUA/exec"
    title="Portal Vision"
    allow="camera; microphone; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <div id="installBar">
    <img src="./icons/icon-192.png" alt="">
    <div id="installText">
      <strong>Instalar Portal Vision</strong>
      <span>Adicione o Portal à tela inicial e abra como aplicativo.</span>
    </div>
    <button id="installBtn">INSTALAR</button>
    <button id="dismissBtn" aria-label="Fechar">×</button>
  </div>

  <div id="iosHelp">
    <div class="sheet">
      <h2>Adicionar à Tela de Início</h2>
      <p>No Safari, toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>.</p>
      <button id="closeIosHelp">ENTENDI</button>
    </div>
  </div>

  <script>
    const frame = document.getElementById('appFrame');
    const installBar = document.getElementById('installBar');
    const installBtn = document.getElementById('installBtn');
    const dismissBtn = document.getElementById('dismissBtn');
    const iosHelp = document.getElementById('iosHelp');
    let deferredPrompt = null;

    frame.addEventListener('load', () => {
      setTimeout(() => document.body.classList.add('ready'), 350);
    });

    // fallback: não deixar splash preso se o load demorar
    setTimeout(() => document.body.classList.add('ready'), 6500);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;
      installBar.classList.add('show');
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBar.classList.remove('show');
        return;
      }

      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      if (isIOS) iosHelp.classList.add('show');
    });

    dismissBtn.addEventListener('click', () => installBar.classList.remove('show'));
    document.getElementById('closeIosHelp').addEventListener('click', () => iosHelp.classList.remove('show'));

    window.addEventListener('appinstalled', () => {
      installBar.classList.remove('show');
    });

    // iOS: não existe beforeinstallprompt; mostra dica discreta quando não instalado.
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (isIOS && !standalone) {
      setTimeout(() => installBar.classList.add('show'), 1800);
    }
  </script>
</body>
</html>
