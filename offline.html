<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061b3a">
<title>Portal Vision - Sem conexão</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061b3a;color:#fff;font-family:Arial,sans-serif;padding:24px;box-sizing:border-box}
.card{max-width:390px;text-align:center}.icon{font-size:52px}h1{font-size:22px;margin:16px 0 8px}p{opacity:.82;line-height:1.5;font-size:14px}
button{margin-top:12px;border:0;border-radius:12px;padding:13px 18px;font-weight:800;color:#061b3a;background:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>Sem conexão com a internet</h1>
  <p>O Portal Vision precisa de internet para consultar reservas, encomendas e dados em tempo real.</p>
  <button onclick="location.reload()">TENTAR NOVAMENTE</button>
</div>
</body>
</html>
